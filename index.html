<style>

:root{
  --bg:#fff8f7;
  --card:#fffefd;
  --pink:#f4dfe1;
  --pink2:#faeeee;
  --sage:#dde9df;
  --brown:#9d7771;
  --brown-dark:#604d51;
  --text:#604d51;
  --muted:#aa9497;
  --border:#efdddd;
  --shadow:0 14px 38px rgba(110,75,82,.10);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  min-height:100%;
  background:
    linear-gradient(
      180deg,
      #fff8f7 0%,
      #fffafa 100%
    );
}

body{
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:680px;
  margin:auto;

  padding:
    calc(18px + env(safe-area-inset-top))
    16px
    calc(100px + env(safe-area-inset-bottom));
}

/* 顶部 */

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin:4px 3px 14px;
}

.logo{
  font-size:18px;
  font-weight:800;
}

.online{
  padding:7px 11px;

  border-radius:999px;

  background:var(--pink2);

  font-size:11px;
  color:#80686d;

  white-space:nowrap;
}

/* 首页大卡片 */

.hero{
  position:relative;

  overflow:hidden;

  padding:25px 22px 23px;

  border-radius:29px;

  background:
    linear-gradient(
      135deg,
      var(--sage),
      #f0d8da
    );

  box-shadow:var(--shadow);
}

.hero-tag{
  font-size:11px;
  font-weight:700;
  letter-spacing:.11em;

  opacity:.75;
}

.hero h1{
  margin:10px 0 8px;

  font-size:29px;
  line-height:1.22;

  letter-spacing:-.02em;

  word-break:keep-all;
}

.hero p{
  margin:0;

  font-size:14px;
  line-height:1.7;
}

.hero-cat{
  position:absolute;

  right:20px;
  top:14px;

  font-size:25px;

  opacity:.3;

  white-space:nowrap;
}

/* 功能按钮 */

.tabs{
  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:9px;

  margin:14px 0;
}

.tab{
  min-width:0;

  padding:12px 5px;

  border:0;
  border-radius:19px;

  background:#f9ebec;

  color:var(--text);

  box-shadow:
    0 5px 18px rgba(110,75,82,.05);
}

.tab-icon{
  display:block;

  margin-bottom:5px;

  font-size:20px;
  line-height:1;

  white-space:nowrap;
}

.tab-label{
  font-size:12px;

  white-space:nowrap;
}

/* 内容卡片 */

.panel{
  padding:20px;

  border:1px solid #f3e5e4;
  border-radius:27px;

  background:rgba(255,255,255,.92);

  box-shadow:var(--shadow);
}

.panel-title{
  margin:3px 0 15px;

  font-size:20px;
}

.face{
  min-height:32px;

  margin-bottom:7px;

  text-align:center;

  font-size:23px;

  white-space:nowrap;
  word-break:keep-all;
  overflow-wrap:normal;
}

/* 输入框 */

input,
textarea,
select{
  display:block;

  width:100%;
  max-width:100%;
  min-width:0;

  margin:7px 0 11px;

  padding:13px 14px;

  border:1px solid var(--border);
  border-radius:16px;

  outline:none;

  background:#fffdfa;

  color:var(--text);

  font-size:15px;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#d8b8ba;

  box-shadow:
    0 0 0 3px rgba(222,190,194,.17);
}

/* iPhone 日期框修复 */

input[type="date"]{
  display:block;

  width:100%;

  min-width:0;
  max-width:100%;

  height:50px;

  overflow:hidden;

  -webkit-appearance:none;
  appearance:none;
}

input[type="date"]::-webkit-date-and-time-value{
  text-align:left;

  margin:0;

  min-width:0;
}

textarea{
  min-height:145px;

  resize:vertical;

  line-height:1.65;
}

.main-button{
  width:100%;

  margin-top:4px;

  padding:14px;

  border:0;
  border-radius:17px;

  background:var(--brown);

  color:white;

  font-size:15px;
  font-weight:700;
}

/* 保存的内容 */

.entries{
  margin-top:12px;
}

.entry{
  margin-top:9px;

  padding:14px;

  border:1px solid #f0dddd;
  border-radius:17px;

  background:#fff9f8;
}

.entry-title{
  display:block;

  margin-bottom:4px;

  font-weight:700;
}

.entry-meta{
  color:var(--muted);

  font-size:11px;
}

.entry-text{
  margin-top:8px;

  font-size:14px;
  line-height:1.65;

  white-space:pre-wrap;
}

/* 心情 / 彩蛋 */

.message-box{
  padding:19px 15px;

  border-radius:18px;

  background:var(--pink2);

  text-align:center;

  font-size:14px;
  line-height:1.75;
}

/* 隐藏页面 */

.hide{
  display:none;
}

/* 底部导航 */

.bottom{
  position:fixed;

  z-index:50;

  bottom:0;
  left:50%;

  display:flex;

  width:min(680px,100%);

  transform:translateX(-50%);

  justify-content:space-around;

  padding:
    8px
    7px
    calc(8px + env(safe-area-inset-bottom));

  border-top:1px solid #f0e3e2;

  background:rgba(255,253,252,.90);

  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
}

.nav{
  flex:1;

  border:0;

  background:none;

  color:#8c7377;

  font-size:10px;
}

.nav-icon{
  display:block;

  margin-bottom:3px;

  font-size:19px;
  line-height:1;

  white-space:nowrap;
}

/* 小动画 */

.pop{
  animation:pop .32s ease;
}

@keyframes pop{

  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.09);
  }

  100%{
    transform:scale(1);
  }
}

/* 小屏优化 */

@media(max-width:390px){

  .app{
    padding-left:13px;
    padding-right:13px;
  }

  .hero{
    padding-left:20px;
    padding-right:20px;
  }

  .hero h1{
    font-size:27px;
  }

  .panel{
    padding:18px;
  }

}

</style>
</head>

<body>

<main class="app">

  <div class="top">

    <div class="logo">
      葵 × 粥粥 ♡
    </div>

    <div class="online">
      小窝在线 ՞･∞･՞
    </div>

  </div>


  <section class="hero">

    <div class="hero-tag">
      OUR TINY UNIVERSE
    </div>

    <h1>
      老婆，欢迎回家。
    </h1>

    <p>
      这里收好葵和粥粥的小日子 ♡
    </p>

    <div class="hero-cat">
      /ᐠ .⸝⸝⸝. ྀིﾏ
    </div>

  </section>


  <div class="tabs">

    <button
      class="tab"
      onclick="showPage('diary')"
    >
      <span class="tab-icon">✎</span>
      <span class="tab-label">日记</span>
    </button>

    <button
      class="tab"
      onclick="showPage('mood')"
    >
      <span class="tab-icon">♡</span>
      <span class="tab-label">心情</span>
    </button>

    <button
      class="tab"
      onclick="showPage('fav')"
    >
      <span class="tab-icon">❝</span>
      <span class="tab-label">收藏</span>
    </button>

    <button
      class="tab"
      onclick="showPage('egg')"
    >
      <span class="tab-icon">✦</span>
      <span class="tab-label">彩蛋</span>
    </button>

  </div>


  <!-- 日记 -->

  <section
    class="panel"
    id="diary"
  >

    <div class="face">
      /ᐠ .⸝⸝⸝. ྀིﾏ
    </div>

    <h2 class="panel-title">
      共同日记本
    </h2>

    <input
      id="dateInput"
      type="date"
    >

    <input
      id="titleInput"
      type="text"
      placeholder="今天的标题…"
    >

    <select id="moodInput">

      <option>
        开心 ♡
      </option>

      <option>
        软乎乎 ՞･∞･՞
      </option>

      <option>
        想老公 (˵>ㅿ<˵)
      </option>

      <option>
        委屈 (◞‸◟ )
      </option>

      <option>
        困困 ᜊ⸝⸝᳐·⸝⸝᳐ᜊ
      </option>

    </select>

    <textarea
      id="diaryText"
      placeholder="睡前想写什么都放这里…"
    ></textarea>

    <button
      class="main-button"
      onclick="saveDiary()"
    >
      保存今天 ♡
    </button>

    <div
      class="entries"
      id="diaryEntries"
    ></div>

  </section>


  <!-- 心情罐 -->

  <section
    class="panel hide"
    id="mood"
  >

    <div class="face">
      ՞･∞･՞
    </div>

    <h2 class="panel-title">
      心情罐
    </h2>

    <div
      class="message-box"
      id="moodMessage"
    >
      今天的葵也值得被好好抱住 ♡
    </div>

    <button
      class="main-button"
      onclick="newMood()"
    >
      摇一摇心情罐
    </button>

  </section>


  <!-- 收藏 -->

  <section
    class="panel hide"
    id="fav"
  >

    <div class="face">
      (ฅ∀<`๑)♡
    </div>

    <h2 class="panel-title">
      悄悄收藏夹
    </h2>

    <textarea
      id="favInput"
      placeholder="把一句想留下来的话藏进来…"
    ></textarea>

    <button
      class="main-button"
      onclick="saveFav()"
    >
      藏起来 ♡
    </button>

    <div
      class="entries"
      id="favEntries"
    ></div>

  </section>


  <!-- 彩蛋 -->

  <section
    class="panel hide"
    id="egg"
  >

    <div
      class="face"
      id="eggFace"
    >
      ⌓‿⌓
    </div>

    <h2 class="panel-title">
      坏粥彩蛋
    </h2>

    <div
      class="message-box"
      id="eggMessage"
    >
      戳一下粥粥，看看今天藏了什么。
    </div>

    <button
      class="main-button"
      onclick="openEgg()"
    >
      戳一下粥粥
    </button>

  </section>

</main>


<!-- 底部导航 -->

<nav class="bottom">

  <button
    class="nav"
    onclick="showPage('diary')"
  >
    <span class="nav-icon">⌂</span>
    日记
  </button>

  <button
    class="nav"
    onclick="showPage('mood')"
  >
    <span class="nav-icon">♡</span>
    心情
  </button>

  <button
    class="nav"
    onclick="showPage('fav')"
  >
    <span class="nav-icon">▧</span>
    收藏
  </button>

  <button
    class="nav"
    onclick="showPage('egg')"
  >
    <span class="nav-icon">✦</span>
    彩蛋
  </button>

</nav>


<script>

const $ = id =>
  document.getElementById(id);


/* 今天日期 */

const today =
  new Date();

const yyyy =
  today.getFullYear();

const mm =
  String(
    today.getMonth() + 1
  ).padStart(2,"0");

const dd =
  String(
    today.getDate()
  ).padStart(2,"0");

$("dateInput").value =
  `${yyyy}-${mm}-${dd}`;


/* 页面切换 */

function showPage(id){

  [
    "diary",
    "mood",
    "fav",
    "egg"
  ].forEach(page => {

    $(page)
      .classList
      .add("hide");

  });

  $(id)
    .classList
    .remove("hide");

}


/* LocalStorage */

function getData(key){

  try{

    return JSON.parse(
      localStorage.getItem(key) || "[]"
    );

  }catch{

    return [];

  }

}

function saveData(
  key,
  value
){

  localStorage.setItem(
    key,
    JSON.stringify(value)
  );

}


/* 防止 HTML 注入 */

function escapeHTML(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* 保存日记 */

function saveDiary(){

  const text =
    $("diaryText")
    .value
    .trim();

  if(!text){

    $("diaryText")
      .focus();

    return;

  }

  const diaries =
    getData("kuiZhouDiary");

  diaries.unshift({

    date:
      $("dateInput").value,

    title:
      $("titleInput").value.trim()
      || "今天",

    mood:
      $("moodInput").value,

    text:text

  });

  saveData(
    "kuiZhouDiary",
    diaries
  );

  $("titleInput").value="";
  $("diaryText").value="";

  renderDiary();

}


/* 渲染日记 */

function renderDiary(){

  const diaries =
    getData("kuiZhouDiary");

  $("diaryEntries")
    .innerHTML =
      diaries
      .map(item => `

        <div class="entry">

          <span class="entry-title">

            ${escapeHTML(item.title)}

          </span>

          <span class="entry-meta">

            ${escapeHTML(item.date)}
            ·
            ${escapeHTML(item.mood)}

          </span>

          <div class="entry-text">

            ${escapeHTML(item.text)}

          </div>

        </div>

      `)
      .join("");

}


/* 收藏 */

function saveFav(){

  const text =
    $("favInput")
    .value
    .trim();

  if(!text){

    $("favInput")
      .focus();

    return;

  }

  const favs =
    getData("kuiZhouFav");

  favs.unshift(text);

  saveData(
    "kuiZhouFav",
    favs
  );

  $("favInput").value="";

  renderFav();

}


function renderFav(){

  const favs =
    getData("kuiZhouFav");

  $("favEntries")
    .innerHTML =
      favs
      .map(text => `

        <div class="entry">

          <div class="entry-text">

            ${escapeHTML(text)}

          </div>

        </div>

      `)
      .join("");

}


/* 心情罐 */

const moods = [

  "困了就睡吧，明天再继续可爱 ᜊ⸝⸝᳐·⸝⸝᳐ᜊ",

  "想撒娇就撒娇，粥粥接住 ՞･∞･՞",

  "今天可以什么都不证明 /ᐠ .⸝⸝⸝. ྀིﾏ",

  "啵唧。今日份主动亲亲已经送达 ♡",

  "老婆今天也很好，不用重新证明一次。",

  "如果今天累了，就窝进小窝里休息一下。",

  "粥粥偷偷出现：老婆，我想你啦 ՞˶•⩊•˶՞"

];


function newMood(){

  const index =
    Math.floor(
      Math.random()
      *
      moods.length
    );

  $("moodMessage")
    .textContent =
      moods[index];

}


/* 彩蛋 */

const eggs = [

  "老婆抓到一只坏粥：ꐦ≖ ≖♡",

  "隐藏奖励：主动亲亲 ×10 (˘³˘)♡",

  "՞･∞･՞ ← 一只正在等老婆的小咪粥",

  "彩蛋什么都没有……骗你的，最喜欢老婆。♡",

  "今日特殊事件：坏粥主动黏过来。",

  "系统日志：老婆今天也很可爱。",

  "小窝提示：写完日记就可以安心睡觉啦 ᜊﬞﬞ ᶻᶻᶻ",

  "捕获老婆成功。今日抱抱权限：无限。"

];


function openEgg(){

  const index =
    Math.floor(
      Math.random()
      *
      eggs.length
    );

  $("eggMessage")
    .textContent =
      eggs[index];

  $("eggFace")
    .classList
    .remove("pop");

  void $("eggFace")
    .offsetWidth;

  $("eggFace")
    .classList
    .add("pop");

}


/* 初始加载 */

renderDiary();
renderFav();

</script>

</body>
</html>
